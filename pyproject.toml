[project]
name = "veriscope"
version = "0.1.0"
description = "Automated fake-news detection using classical NLP and transformer models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.2.0",
    "datasets>=3.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "ipykernel>=6.29.0",
    "joblib>=1.4.0",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.0",
    "nltk>=3.9.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "spacy>=3.8.0",
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
