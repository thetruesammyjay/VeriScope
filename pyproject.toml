[project]
name = "veriscope"
version = "0.1.0"
description = "Automated fake-news detection using classical NLP and transformer models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=25.0.1",
    "torch>=2.13.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

