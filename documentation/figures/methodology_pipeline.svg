<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
    <style>.title{font:700 26px Arial,sans-serif;fill:#101828}.box{stroke-width:2}.label{font:700 16px Arial,sans-serif;fill:#101828;text-anchor:middle}.small{font:italic 16px Arial,sans-serif;fill:#475467;text-anchor:middle}.edge{fill:none;stroke:#344054;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Iterative and Incremental Development Process</text>
  <g>
    <rect class="box" x="35" y="145" rx="16" width="190" height="90" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="label" x="130" y="180"><tspan x="130">1. Requirements</tspan><tspan x="130" dy="23">elicitation</tspan></text>
    <rect class="box" x="265" y="145" rx="16" width="200" height="90" fill="#d5e8d4" stroke="#82b366"/>
    <text class="label" x="365" y="180"><tspan x="365">2. Data preparation</tspan><tspan x="365" dy="23">and validation</tspan></text>
    <rect class="box" x="505" y="145" rx="16" width="200" height="90" fill="#ffe6cc" stroke="#d79b00"/>
    <text class="label" x="605" y="180"><tspan x="605">3. Model development</tspan><tspan x="605" dy="23">and evaluation</tspan></text>
    <rect class="box" x="745" y="145" rx="16" width="205" height="90" fill="#e1d5e7" stroke="#9673a6"/>
    <text class="label" x="847" y="180"><tspan x="847">4. API, retrieval and</tspan><tspan x="847" dy="23">evidence verification</tspan></text>
    <rect class="box" x="990" y="145" rx="16" width="180" height="90" fill="#f8cecc" stroke="#b85450"/>
    <text class="label" x="1080" y="174"><tspan x="1080">5. Interface,</tspan><tspan x="1080" dy="22">deployment and</tspan><tspan x="1080" dy="22">end-to-end testing</tspan></text>
    <path class="edge" d="M225 190 H265"/><path class="edge" d="M465 190 H505"/><path class="edge" d="M705 190 H745"/><path class="edge" d="M950 190 H990"/>
  </g>
  <rect class="box" x="275" y="350" rx="16" width="650" height="74" fill="#fff2cc" stroke="#d6b656"/>
  <text class="label" x="600" y="380"><tspan x="600">Testing evidence and user feedback revise</tspan><tspan x="600" dy="24">requirements, data rules and design</tspan></text>
  <path class="edge" d="M1080 235 V300 Q1080 387 925 387"/>
  <path class="edge" d="M275 387 H130 Q70 387 70 330 V235"/>
  <text class="small" x="600" y="500">Each increment: analyse → design → implement → test → review</text>
</svg>
