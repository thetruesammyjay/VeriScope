<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Scrum framework applied to the automated fake-news detection project</title>
  <desc id="desc">A product backlog flows through sprint planning into a sprint backlog and development sprint, producing a tested increment reviewed by stakeholders. Daily Scrum supports the sprint, while sprint review and retrospective feed learning back into the backlog.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#17324a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#17324a}.label{font:700 18px Arial,sans-serif;fill:#17324a}.small{font:15px Arial,sans-serif;fill:#36556d}.box{fill:#f7fbfe;stroke:#315b7d;stroke-width:2.5;rx:16;filter:url(#shadow)}.accent{fill:#dceef8;stroke:#315b7d;stroke-width:2.5}.increment{fill:#e7f4e9;stroke:#39734a;stroke-width:2.5}.event{fill:#fff1d9;stroke:#b7791f;stroke-width:2.5}.flow{fill:none;stroke:#315b7d;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#8a5b20;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="54" text-anchor="middle" class="title">Scrum Framework Applied to the Project</text>

  <rect x="45" y="270" width="180" height="125" class="box"/>
  <text x="135" y="312" text-anchor="middle" class="label">Product Backlog</text>
  <text x="135" y="342" text-anchor="middle" class="small">prioritised features,</text>
  <text x="135" y="365" text-anchor="middle" class="small">experiments and fixes</text>
  <path d="M85 270 C35 235 40 185 95 170 C160 152 215 195 185 266" class="feedback"/>
  <text x="128" y="145" text-anchor="middle" class="small">ongoing backlog refinement</text>

  <rect x="285" y="270" width="180" height="125" class="event" rx="16" filter="url(#shadow)"/>
  <text x="375" y="312" text-anchor="middle" class="label">Sprint Planning</text>
  <text x="375" y="342" text-anchor="middle" class="small">select a sprint goal</text>
  <text x="375" y="365" text-anchor="middle" class="small">and feasible work</text>

  <rect x="525" y="270" width="180" height="125" class="box"/>
  <text x="615" y="312" text-anchor="middle" class="label">Sprint Backlog</text>
  <text x="615" y="342" text-anchor="middle" class="small">dataset, model, API</text>
  <text x="615" y="365" text-anchor="middle" class="small">and retrieval tasks</text>

  <circle cx="875" cy="332" r="112" class="accent" filter="url(#shadow)"/>
  <text x="875" y="310" text-anchor="middle" class="label">Development Sprint</text>
  <text x="875" y="340" text-anchor="middle" class="small">build • test • evaluate</text>
  <text x="875" y="364" text-anchor="middle" class="small">integrate • document</text>

  <rect x="800" y="95" width="150" height="78" class="event" rx="39" filter="url(#shadow)"/>
  <text x="875" y="127" text-anchor="middle" class="label">Daily Scrum</text>
  <text x="875" y="151" text-anchor="middle" class="small">inspect and adapt</text>

  <polygon points="1045,280 1100,248 1155,280 1155,344 1100,376 1045,344" class="increment" filter="url(#shadow)"/>
  <text x="1100" y="303" text-anchor="middle" class="label">Definition</text>
  <text x="1100" y="326" text-anchor="middle" class="label">of Done</text>
  <text x="1100" y="351" text-anchor="middle" class="small">tests pass</text>

  <rect x="1210" y="270" width="155" height="125" class="increment" rx="16" filter="url(#shadow)"/>
  <text x="1288" y="312" text-anchor="middle" class="label">Working</text>
  <text x="1288" y="336" text-anchor="middle" class="label">Increment</text>
  <text x="1288" y="365" text-anchor="middle" class="small">reviewable output</text>

  <rect x="1168" y="485" width="195" height="82" class="event" rx="16" filter="url(#shadow)"/>
  <text x="1265" y="519" text-anchor="middle" class="label">Sprint Review</text>
  <text x="1265" y="545" text-anchor="middle" class="small">stakeholder feedback</text>

  <rect x="555" y="565" width="250" height="82" class="event" rx="16" filter="url(#shadow)"/>
  <text x="680" y="599" text-anchor="middle" class="label">Sprint Retrospective</text>
  <text x="680" y="625" text-anchor="middle" class="small">improve the next sprint</text>

  <path d="M225 332 H285" class="flow"/><path d="M465 332 H525" class="flow"/><path d="M705 332 H753" class="flow"/><path d="M987 332 H1045" class="flow"/><path d="M1155 332 H1210" class="flow"/>
  <path d="M875 173 V218" class="flow"/>
  <path d="M1288 395 V485" class="flow"/>
  <path d="M1168 526 H890 Q850 526 850 566 H805" class="feedback"/>
  <path d="M555 606 H135 Q85 606 85 556 V395" class="feedback"/>
  <path d="M1168 505 H1120 Q1085 505 1085 395" class="feedback"/>
  <text x="930" y="520" class="small">acceptance feedback</text>
  <text x="245" y="594" class="small">learning returns to the product backlog</text>
</svg>
